<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#00ff88">
<title>STEALTH RESILIENCE - MOBILE</title>
<!--
  MOBILE FIRST.
  This build is mobile only: there is no desktop code path any more.
  index.html is now a thin, instant bootstrap that hands over to ./mobile.html,
  so https://<your-site>.vercel.app/ and /mobile.html always run the exact
  same touch build.
-->
<meta http-equiv="refresh" content="0; url=./mobile.html">
<link rel="canonical" href="./mobile.html">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎯</text></svg>">
<style>
html,body{margin:0;padding:0;height:100%;background:#05070a;color:#fff;overflow:hidden;
  font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;touch-action:none;overscroll-behavior:none}
#splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  background:radial-gradient(ellipse at center,#16283a 0%,#0a0e13 65%,#000 100%);text-align:center;padding:24px}
#splash h1{font-size:clamp(26px,9vw,54px);letter-spacing:.12em;line-height:1.05;margin:0;
  background:linear-gradient(90deg,#fff,#00ff88,#00aaff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
#splash p{font-size:12px;opacity:.6;letter-spacing:.16em;margin:0}
a.btn{display:inline-block;margin-top:10px;padding:16px 30px;min-height:52px;background:linear-gradient(90deg,#00ff88,#00cc6a);
  color:#000;font-weight:800;letter-spacing:.1em;text-decoration:none;border-radius:6px;font-size:14px}
</style>
</head>
<body>
<div id="splash">
  <h1>STEALTH<br>RESILIENCE</h1>
  <p>LOADING THE MOBILE BUILD...</p>
  <a class="btn" href="./mobile.html">ENTER GAME</a>
</div>
<script>
  // Instant hand-off to the mobile-only entry point.
  (function () {
    var target = './mobile.html';
    if (window.location.pathname.replace(/\/+$/, '/').slice(-12) !== '/mobile.html') {
      window.location.replace(target);
    }
  })();
</script>
</body>
</html>
